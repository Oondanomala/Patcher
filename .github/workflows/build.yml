name: build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - "LICENSE.md"
      - ".editorconfig"
      - ".gitignore"
      - "data/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE.md"
      - ".editorconfig"
      - ".gitignore"
      - "data/**"

jobs:
  build:
    name: "Build Mod"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: |
            8
            25
          cache: gradle

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@v6

      - name: "Build"
        run: ./gradlew build

      - name: "Upload built mod JAR"
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: versions/*/build/libs/*.jar
          if-no-files-found: error
